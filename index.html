<!DOCTYPE html> 
<html> 

<!--      HEAD       -->


<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
</head>

<!--      HEAD       -->


<body> 

        <div id="left-col">
            <div id="logo">
                <p>Trackly</p>
            </div>

            <div id="buttons">
                <!-- <div id="home"> <p>Home</p> </div> -->
                <div id=""></div>
            </div>

            
        </div>

        <div id="right-col">

    
          <div id="Header">
            
                <!-- Branding heading -->
            
                   <div id="body-content">
                     <h1>Dashboard</h1>
                    
                  </div>
                <!-- ------------------------------------- -->
            
             <!--STATUS CARDS-->
              <div id="Cards">


                   <!-- total wala card -->
                  <div class="tracker-card" id="total-card">
                      <p>Total</p>
                      <p> 0 </p>
                   </div>

                <!----------------------->

                  <!--Applied wala card-->
                    <div class="tracker-card" id="applied-card">
                     <p>Applied</p>
                      <p> 0 </p>
                 </div>


                <!--INTERVIEWS-->
                  <div class="tracker-card" id="interview-card">
                       <p>Interview</p>
                      <p> 0 </p>
                  </div>
                <!------------------------------------>




                <!-- Offers wala -->
                 <div class="tracker-card" id="offers-card">
                     <p>Offers</p>
                     <p> 0 </p>
                  </div>
                <!------------------------------------>


                <!-- Rejected wala -->
                  <div class="tracker-card" id="rejected-card">
                      <p>Rejected</p>
                      <p> 0 </p>
                  </div>
                <!------------------------------------>


             </div>
         </div>




         <div id="Body">
            <!-- form over is just the background div. It covers the entire screen -->
             <div id="form-over">
                    <form id="job-form"> 
                         <h2>Add New Application</h2>
                         <input type="text" id="job-title" placeholder="Job Title">
                         <input type="text" id="company-name" placeholder="Company Name">
                         <input type="text" id="job-description" placeholder="Job Description">
                         <input type="text" id="job-url" placeholder="Job URL">

                    <div class="form-btns">
                        <button type="button" id="AddJob">Add Job</button>
                        <button type="button" id="Exit">Cancel</button>
                    </div>
            </form>
    </div>

    <div class="choice-btn">

                <div id="all">  <p> All </p> </div>
                <div id="Offer">  <p> Offer </p> </div>
                <div id="Interview">  <p> Interview </p> </div>
                <div id="Rejected">  <p> Rejected </p> </div>
                <div id="application"> <p>Add an application </p> </div>
                
            </div>



            <!--Main meat-->
            <div id="container">

                <div id="extra-info">
                    <div class="info">
                        <p>#</p>
                        <p>Title</p>
                        <p>Company</p>
                        <p>Status</p>
                        <p>Date Applied</p>
                        <p>Details</p>
                    </div>
                </div>

                     <div id="job-container">


                  </div>
                


                
                </div>

          </div>

        </div>

    <script src="logic.js"></script>

</body>


</html>
